name: Compilar Release Puro
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
      - name: Decode Keystore
        env:
          KS: ${{ secrets.KEY_STORE_BASE64 }}
        run: echo "$KS" | tr -d '\r\n ' | base64 --decode > app/keystore.jks
      - name: Build Release
        env:
          SP: ${{ secrets.KEY_STORE_PASSWORD }}
          KA: ${{ secrets.KEY_ALIAS }}
          KP: ${{ secrets.KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease -x test -x lint \
            -DpackageSuffix=".miVersion" \
            -Pandroid.injected.signing.store.file="$(pwd)/app/keystore.jks" \
            -Pandroid.injected.signing.store.password="$SP" \
            -Pandroid.injected.signing.key.alias="$KA" \
            -Pandroid.injected.signing.key.password="$KP"
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NewPipe-Firmado-Puro
          path: app/build/outputs/apk/release/*.apk
